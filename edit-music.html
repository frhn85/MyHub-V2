<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Edit Music — MyHub V2</title><link rel="stylesheet" href="style.css"></head><body class="standalone-page"><main class="app edit-page"><div class="page-head"><a class="btn" href="edit-fitur.html">← Edit Fitur</a><h1>Edit Music</h1><p>Kelola data Music dari perangkat ini.</p></div><div class="glass card"><div id="list" class="list"></div></div></main><script>const K='myhub-v2-data';let d=JSON.parse(localStorage.getItem(K));let key='music';function render(){list.innerHTML=d[key].map((x,i)=>'<div class="list-item"><span>'+esc(typeof x==='string'?x:(x.title||x.name||'Item'))+'</span> <button class="btn danger" onclick="del('+i+')">Hapus</button></div>').join('')||'<p class="muted">Belum ada data.</p>'}function del(i){d[key].splice(i,1);localStorage.setItem(K,JSON.stringify(d));render()}function esc(x){return String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}render();</script></body></html>
