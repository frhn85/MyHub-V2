<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Edit Tampilan — MyHub V2</title><link rel="stylesheet" href="style.css"></head><body class="standalone-page"><main class="app edit-page"><div class="page-head"><a class="btn" href="edit-fitur.html">← Edit Fitur</a><h1>Edit Tampilan</h1></div><div class="glass card form"><label><input type="checkbox" id="aurora"> Aurora background</label><label><input type="checkbox" id="anim"> Animasi teks</label><button class="btn" onclick="save()">Simpan</button></div></main><script>const K='myhub-v2-data';let d=JSON.parse(localStorage.getItem(K));aurora.checked=!!d.aurora;anim.checked=!!d.animations;function save(){d.aurora=aurora.checked;d.animations=anim.checked;localStorage.setItem(K,JSON.stringify(d));alert('Tampilan tersimpan')}</script></body></html>
