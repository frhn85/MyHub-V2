<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Edit Tampilan — MyHub V2</title><link rel="stylesheet" href="style.css"></head><body class="standalone-page"><main class="app edit-page"><div class="page-head"><a class="btn" href="edit-fitur.html">← Edit Fitur</a><h1>Tampilan</h1><p>Atur tema dan animasi MyHub.</p></div><div class="glass card form"><label><input type="checkbox" id="anim"> Animasi teks</label><button class="btn" onclick="toggleTheme();save()">Simpan</button></div></main><script>const K='myhub-v2-data';let d=JSON.parse(localStorage.getItem(K));anim.checked=d.animations!==false;function save(){d.animations=anim.checked;localStorage.setItem(K,JSON.stringify(d));alert('Tampilan tersimpan')}</script><script>if(localStorage.getItem('myhub-theme')==='light')document.body.classList.add('light-theme');function toggleTheme(){document.body.classList.toggle('light-theme');localStorage.setItem('myhub-theme',document.body.classList.contains('light-theme')?'light':'dark')}</script></body></html>
