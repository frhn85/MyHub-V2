<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#061326"><title>MyHub V2</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="GooeyNav.css">
<link rel="stylesheet" href="profile-card.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>
<body>
<canvas id="aurora"></canvas><div class="aurora-overlay"></div><div id="authRoot"></div>
<header class="topbar">
  <div class="brand fold-text"><span class="brand-logo" aria-hidden="true"><i class="fa-solid fa-atom"></i></span><span>MyHub V2</span></div>
  <div class="top-actions">
    <button id="searchBtn" class="top-icon-btn" aria-label="Search" title="Search"><i class="fa-solid fa-magnifying-glass"></i></button>
    <button id="themeBtn" class="top-icon-btn" aria-label="Ubah tampilan" title="Ubah tampilan"><i class="fa-solid fa-sun"></i></button>
    <button id="menuBtn" class="top-icon-btn" aria-label="Buka menu" title="Menu"><i class="fa-solid fa-bars"></i></button>
  </div>
</header>
<main id="app" class="app"></main>
<div id="toast" class="toast"></div>
<div id="drawer" class="drawer"><div class="drawer-head"><div><b id="accountName">Account</b><small id="accountInfo">MyHub V2</small></div><button id="closeDrawer" class="icon-btn">×</button></div><div id="drawerMenu" class="drawer-menu"></div></div><div id="drawerShade" class="drawer-shade"></div>
<footer id="dock" class="dock"></footer>
<div id="modalRoot"></div>
<script src="GooeyNav.js"></script>
<script src="profile-card.js"></script>
<script src="script.js"></script>
</body></html>
