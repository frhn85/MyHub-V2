<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Beranda — MyHub V2</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"></head><body class="standalone-page"><main class="app edit-page"><div class="page-head"><a class="btn" href="edit-fitur.html"><i class="fa-solid fa-arrow-left"></i> Edit Fitur</a><h1>Beranda</h1></div><div class="glass card form"><label>Judul Home</label><input class="input" id="title"><label>Subtitle</label><input class="input" id="sub"><button class="btn" onclick="save()">Simpan</button></div></main><script>const K='myhub-v2-data';let d=JSON.parse(localStorage.getItem(K));title.value=d.home.title;sub.value=d.home.subtitle;function save(){d.home.title=title.value;d.home.subtitle=sub.value;localStorage.setItem(K,JSON.stringify(d));alert('Home tersimpan')}</script><script>if(localStorage.getItem('myhub-theme')==='light')document.body.classList.add('light-theme');</script></body></html>
