<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#061326"><title>Profil — MyHub V2"><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="profile-card.css"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"></head><body class="standalone-page"><main class="app edit-page"><div class="page-head"><a class="btn" href="edit-fitur.html"><i class="fa-solid fa-arrow-left"></i> Edit Fitur</a><h1>Profil</h1><p>Perubahan ini langsung dipakai ProfileCard.</p></div><div id="preview"></div><div class="glass card form"><label>Foto profil</label><input class="input" id="photo" type="file" accept="image/*"><button class="btn" onclick="savePhoto()">Simpan Foto</button><label>Nama</label><input class="input" id="name"><label>Info</label><input class="input" id="info"><button class="btn" onclick="saveProfile()">Simpan Profil</button></div></main><script src="profile-card.js"></script><script>const KEY='myhub-v2-data';let d=JSON.parse(localStorage.getItem(KEY)||'null');if(!d){location.href='index.html';}function esc(x=''){return String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function attr(x=''){return esc(x)}function render(){document.querySelector('#preview').innerHTML=renderProfileCard(d.profile);initProfileCards();document.querySelector('#name').value=d.profile.name||'';document.querySelector('#info').value=d.profile.info||''}function save(){localStorage.setItem(KEY,JSON.stringify(d));render();alert('Profil tersimpan')}function saveProfile(){d.profile.name=document.querySelector('#name').value.trim()||'MyHub User';d.profile.info=document.querySelector('#info').value.trim()||'MyHub V2';save()}function savePhoto(){const f=document.querySelector('#photo').files[0];if(!f)return alert('Pilih foto dulu');const r=new FileReader();r.onload=()=>{d.profile.photo=r.result;save()};r.readAsDataURL(f)}render();</script><script>if(localStorage.getItem('myhub-theme')==='light')document.body.classList.add('light-theme');</script></body></html>
